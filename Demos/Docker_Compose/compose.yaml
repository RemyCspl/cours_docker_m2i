services:
  # On donne un nom à notre service pour l'identifier plus facilement, on peut le nommer comme on veut, ici on l'appelle "web"
  web:
    container_name: mon-site-web
    image: nginx:latest
    ports:
      - "5005:80"
  web2:
    image: httpd
    ports:
      - "5000:80"
  web3:
    image: oats87/2048
    ports:
      - "5001:80"
  web4:
    container_name: site_qui_tourne
    build: .
    ports: 
     - "5002:80"

# Equivalent à:
# docker run -p 5005:80 --name mon-site-web nginx:latest

# Pour lancer le conteneur via le docker-compose:
# docker compose up -d